<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800">
  <style>
    /* Follows the reader's light or dark setting, like the rest of arkive. */
    [fill="#ffffff"] { fill: none; }
    text[fill] { fill: #1b1b1b; font-size: 18px; font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      [fill="#a5d8ff"] { fill: #173452; }
      [stroke="#a5d8ff"] { stroke: #173452; }
      [fill="#b2f2bb"] { fill: #173a22; }
      [stroke="#b2f2bb"] { stroke: #173a22; }
      [fill="#d0bfff"] { fill: #2b2350; }
      [stroke="#d0bfff"] { stroke: #2b2350; }
      [fill="#dee2e6"] { fill: #2a2d31; }
      [stroke="#dee2e6"] { stroke: #2a2d31; }
      [fill="#ffc9c9"] { fill: #47201f; }
      [stroke="#ffc9c9"] { stroke: #47201f; }
      [fill="#ffd8a8"] { fill: #45290f; }
      [stroke="#ffd8a8"] { stroke: #45290f; }
      [fill="#ffec99"] { fill: #3f3610; }
      [stroke="#ffec99"] { stroke: #3f3610; }
      [fill="#f8f9fa"] { fill: #1a1b1d; }
      [stroke="#f8f9fa"] { stroke: #1a1b1d; }
      [fill="#1971c2"] { fill: #4dabf7; }
      [stroke="#1971c2"] { stroke: #4dabf7; }
      [fill="#2f9e44"] { fill: #51cf66; }
      [stroke="#2f9e44"] { stroke: #51cf66; }
      [fill="#7048e8"] { fill: #9775fa; }
      [stroke="#7048e8"] { stroke: #9775fa; }
      [fill="#495057"] { fill: #adb5bd; }
      [stroke="#495057"] { stroke: #adb5bd; }
      [fill="#e03131"] { fill: #ff8787; }
      [stroke="#e03131"] { stroke: #ff8787; }
      [fill="#e8590c"] { fill: #ff922b; }
      [stroke="#e8590c"] { stroke: #ff922b; }
      [fill="#f08c00"] { fill: #fcc419; }
      [stroke="#f08c00"] { stroke: #fcc419; }
      [fill="#1e1e1e"] { fill: #e9e9e7; }
      [stroke="#1e1e1e"] { stroke: #e9e9e7; }
      text[fill] { fill: #e9e9e7; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1060" height="800" fill="#ffffff" />
  <rect x="330" y="40" width="340" height="84" rx="8" ry="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" opacity="1" />
  <rect x="330" y="184" width="340" height="84" rx="8" ry="8" fill="#d0bfff" stroke="#7048e8" stroke-width="2" opacity="1" />
  <rect x="330" y="328" width="340" height="84" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1" />
  <rect x="330" y="472" width="340" height="84" rx="8" ry="8" fill="#ffec99" stroke="#f08c00" stroke-width="2" opacity="1" />
  <rect x="330" y="616" width="340" height="84" rx="8" ry="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" opacity="1" />
  <rect x="780" y="40" width="240" height="84" rx="8" ry="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2" opacity="1" />
  <polyline points="500.0,124 500.0,184" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="500.0,268 500.0,328" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="500.0,412 500.0,472" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="500.0,556 500.0,616" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="330,100 300,100 300,356 330,356" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="330,82 270,82 270,500 330,500" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="330,64 240,64 240,658 330,658" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="670,370 690,370 690,656 670,656" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="670,226 720,226 720,492 670,492" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="670,244 750,244 750,630 670,630" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="820,124 820,202 670,202" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="870,124 870,526 670,526" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="920,124 920,682 670,682" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="500.0" y="77.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="500.0" dy="0">Apps: apps/*</tspan>
    <tspan x="500.0" dy="20">(app, www; later cli)</tspan>
  </text>
  <text x="500.0" y="221.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="500.0" dy="0">Registry: packages/features-registry</tspan>
    <tspan x="500.0" dy="20">(collects every feature)</tspan>
  </text>
  <text x="500.0" y="365.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="500.0" dy="0">Features: packages/features/*</tspan>
    <tspan x="500.0" dy="20">(one product area each)</tspan>
  </text>
  <text x="500.0" y="509.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="500.0" dy="0">Platform: packages/platform/*</tspan>
    <tspan x="500.0" dy="20">(synergy)</tspan>
  </text>
  <text x="500.0" y="653.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="500.0" dy="0">Foundation: packages/foundation/*</tspan>
    <tspan x="500.0" dy="20">(core, ui, i18n)</tspan>
  </text>
  <text x="900.0" y="67.0" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="900.0" dy="0">Ops: packages/ops</tspan>
    <tspan x="900.0" dy="20">(privileged scripts,</tspan>
    <tspan x="900.0" dy="20">imported by nothing)</tspan>
  </text>
  <text x="530.0" y="746" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">An arrow means "may import". Packages in the same layer never import each other:</text>
  <text x="530.0" y="768" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">no feature imports another feature, and the same holds for platform and foundation.</text>
</svg>
