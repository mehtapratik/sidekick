      [stroke="#7048e8"] { stroke: #9775fa; }
      [fill="#495057"] { fill: #adb5bd; }
      [stroke="#495057"] { stroke: #adb5bd; }
      [fill="#e03131"] { fill: #ff8787; }
      [stroke="#e03131"] { stroke: #ff8787; }
      [fill="#e8590c"] { fill: #ff922b; }
      [stroke="#e8590c"] { stroke: #ff922b; }
      [fill="#f08c00"] { fill: #fcc419; }
      [stroke="#f08c00"] { stroke: #fcc419; }
      [fill="#1e1e1e"] { fill: #e9e9e7; }
      [stroke="#1e1e1e"] { stroke: #e9e9e7; }
      text[fill] { fill: #e9e9e7; }
    }
