  <polyline points="690,808 690,888" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="1210,372 1200,464" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
