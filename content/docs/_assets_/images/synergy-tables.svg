    <tspan x="638" dy="0">Non-syncable</tspan>
  </text>
  <text x="500" y="92" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="500" dy="0">provider table</tspan>
    <tspan x="500" dy="20">(e.g. ops.notes)</tspan>
    <tspan x="500" dy="20">content JSON</tspan>
  </text>
  <text x="500" y="304" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="500" dy="0">entity_index</tspan>
    <tspan x="500" dy="20">provider, type, status</tspan>
    <tspan x="500" dy="20">version, revision, content_seq</tspan>
  </text>
  <text x="160" y="514" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="160" dy="0">version_log</tspan>
    <tspan x="160" dy="20">version, change note</tspan>
  </text>
  <text x="500" y="514" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="500" dy="0">entity_anchors</tspan>
    <tspan x="500" dy="20">anchor id, removed_in_version</tspan>
  </text>
  <text x="690" y="938" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="690" dy="0">entity_mentions</tspan>
    <tspan x="690" dy="20">entity id, relationship id</tspan>
  </text>
  <text x="690" y="706" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="690" dy="0">relationships</tspan>
    <tspan x="690" dy="20">from, to: entity_index ids</tspan>
    <tspan x="690" dy="20">to_anchor, role, type, snapshot</tspan>
    <tspan x="690" dy="20">cited, mentioned</tspan>
  </text>
  <text x="880" y="514" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="880" dy="0">relation_types</tspan>
    <tspan x="880" dy="20">source_key, target_key, kind</tspan>
  </text>
  <text x="1210" y="314" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="1210" dy="0">tags</tspan>
    <tspan x="1210" dy="20">name, alias-of</tspan>
  </text>
  <text x="1200" y="514" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="1200" dy="0">tag_applications</tspan>
    <tspan x="1200" dy="20">(entity or link)</tspan>
  </text>
  <text x="750" y="92" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="750" dy="0">outbox</tspan>
    <tspan x="750" dy="20">event, xact_id</tspan>
    <tspan x="750" dy="20">(hard delete)</tspan>
  </text>
  <text x="1000" y="102" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="1000" dy="0">idempotency_keys</tspan>
    <tspan x="1000" dy="20">(hard delete)</tspan>
  </text>
  <text x="500" y="217.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
