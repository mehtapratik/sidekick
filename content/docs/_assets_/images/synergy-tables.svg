      [stroke="#ffc9c9"] { stroke: #47201f; }
      [fill="#ffd8a8"] { fill: #45290f; }
      [stroke="#ffd8a8"] { stroke: #45290f; }
      [fill="#ffec99"] { fill: #3f3610; }
      [stroke="#ffec99"] { stroke: #3f3610; }
      [fill="#f8f9fa"] { fill: #1a1b1d; }
