<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1412" width="400" height="1412">
  <style>
    /* Follows the reader's light or dark setting, like the rest of arkive. */
    [fill="#ffffff"] { fill: none; }
    text[fill] { fill: #1b1b1b; font-size: 18px; font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      [fill="#a5d8ff"] { fill: #173452; }
      [stroke="#a5d8ff"] { stroke: #173452; }
      [fill="#b2f2bb"] { fill: #173a22; }
      [stroke="#b2f2bb"] { stroke: #173a22; }
      [fill="#d0bfff"] { fill: #2b2350; }
      [stroke="#d0bfff"] { stroke: #2b2350; }
      [fill="#dee2e6"] { fill: #2a2d31; }
      [stroke="#dee2e6"] { stroke: #2a2d31; }
      [fill="#ffc9c9"] { fill: #47201f; }
      [stroke="#ffc9c9"] { stroke: #47201f; }
      [fill="#ffd8a8"] { fill: #45290f; }
      [stroke="#ffd8a8"] { stroke: #45290f; }
      [fill="#ffec99"] { fill: #3f3610; }
      [stroke="#ffec99"] { stroke: #3f3610; }
      [fill="#f8f9fa"] { fill: #1a1b1d; }
      [stroke="#f8f9fa"] { stroke: #1a1b1d; }
      [fill="#1971c2"] { fill: #4dabf7; }
      [stroke="#1971c2"] { stroke: #4dabf7; }
      [fill="#2f9e44"] { fill: #51cf66; }
      [stroke="#2f9e44"] { stroke: #51cf66; }
      [fill="#7048e8"] { fill: #9775fa; }
      [stroke="#7048e8"] { stroke: #9775fa; }
      [fill="#495057"] { fill: #adb5bd; }
      [stroke="#495057"] { stroke: #adb5bd; }
      [fill="#e03131"] { fill: #ff8787; }
      [stroke="#e03131"] { stroke: #ff8787; }
      [fill="#e8590c"] { fill: #ff922b; }
      [stroke="#e8590c"] { stroke: #ff922b; }
      [fill="#f08c00"] { fill: #fcc419; }
      [stroke="#f08c00"] { stroke: #fcc419; }
      [fill="#1e1e1e"] { fill: #e9e9e7; }
      [stroke="#1e1e1e"] { stroke: #e9e9e7; }
      text[fill] { fill: #e9e9e7; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e" />
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="1412" fill="#ffffff" />
  <rect x="40" y="40" width="320" height="132" rx="8" ry="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" opacity="1" />
  <rect x="65" y="252" width="270" height="108" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1" />
  <rect x="105" y="440" width="190" height="108" rx="8" ry="8" fill="#dee2e6" stroke="#495057" stroke-width="2" opacity="1" />
  <rect x="90" y="628" width="220" height="108" rx="8" ry="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2" opacity="1" />
  <rect x="95" y="816" width="210" height="156" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1" />
  <rect x="105" y="1052" width="190" height="132" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1" />
  <rect x="65" y="1264" width="270" height="108" rx="8" ry="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" opacity="1" />
  <polyline points="200,172 200,252" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="200,360 200,440" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="200,548 200,628" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="200,736 200,816" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="200,972 200,1052" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="200,1184 200,1264" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="92" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="200" dy="0">Editor or bot</tspan>
    <tspan x="200" dy="20">sends content, base content_seq,</tspan>
    <tspan x="200" dy="20">current sets</tspan>
  </text>
  <text x="200" y="302" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="200" dy="0">Provider route</tspan>
    <tspan x="200" dy="20">(withApiGuard, withRLS)</tspan>
  </text>
  <text x="200" y="490" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="200" dy="0">Provider writes</tspan>
    <tspan x="200" dy="20">its own row</tspan>
  </text>
  <text x="200" y="678" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="200" dy="0">Synergy save call</tspan>
    <tspan x="200" dy="20">take per-user lock</tspan>
  </text>
  <text x="200" y="870" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="200" dy="0">check content_seq</tspan>
    <tspan x="200" dy="20">(stale: refuse)</tspan>
    <tspan x="200" dy="20">diff current sets</tspan>
    <tspan x="200" dy="20">protect passages</tspan>
  </text>
  <text x="200" y="1104" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="200" dy="0">tombstone links</tspan>
    <tspan x="200" dy="20">bump counters</tspan>
    <tspan x="200" dy="20">write outbox</tspan>
  </text>
  <text x="200" y="1314" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="200" dy="0">Postgres</tspan>
    <tspan x="200" dy="20">one transaction commits</tspan>
  </text>
</svg>