name: Labeler

on:
   pull_request:

# Labelling writes to the PR, so unlike CI this job needs a write scope
permissions:
   contents: read
   pull-requests: write

jobs:
   label:
      runs-on: ubuntu-26.04
      timeout-minutes: 5
      steps:
         # Removes the label again when a later push adds a file outside content/
         - uses: actions/labeler@v7
           with:
              sync-labels: true
