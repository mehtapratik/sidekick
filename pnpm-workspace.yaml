packages:
   - 'apps/*'
   - 'packages/*'
   - 'packages/foundation/*'
   - 'packages/platform/*'
   - 'packages/features/*'
   - 'content'
allowBuilds:
   esbuild: true
   sharp: true
   unrs-resolver: true
   workerd: true
# With `engineStrict: true`, pnpm refuses to install when the running Node doesn’t
# satisfy an engines field, ours or a dependency’s.
engineStrict: true
