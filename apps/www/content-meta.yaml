site:
   title: ARKIVE
   hero: 00-margins
   heroImage: null
   url: https://arkive.blog
   repoUrl: https://github.com/mehtapratik/sidekick
   intro: "Notes, decisions, and progress on my journey as I build Project Sidekick — built in the open; written as it happens."

defaults:
   author: Pratik Mehta
   license: CC BY-NC 4.0
   version: 1.0.0

vault:
   root: ./sources/docs
   exclude:
      - "00-principles/**"
      - "01-motivations/**"
      - "_assets_/**"
      - "**/*.canvas"
      - ".obsidian/**"
   sections:
      02-prd: { slug: prd, label: Product requirements }
      03-system-design: { slug: system-design, label: System design }
      04-plans: { slug: plans, label: Plans }
      05-builds: { slug: builds, label: Builds }
      06-decisions: { slug: decisions, label: Decisions }
      07-glossary: { slug: glossary, label: Glossary }
      08-ai-coding-harness: { slug: harness, label: AI coding harness }
   statusMap:
      proposed: draft
      accepted: approved
      planned: approved
      completed: built
      resolved: built
      deferred: draft
   titleDictionary:
      [
         API,
         PRD,
         RLS,
         AI,
         UX,
         UI,
         CLI,
         DB,
         PWA,
         RAG,
         SQL,
         JSON,
         YAML,
         HTTP,
         URL,
         ID,
         OG,
         RSS,
         SEO,
         MOC,
         CSS,
         HTML,
         JS,
         TS,
         ESLint,
         GraphQL,
         Relay,
         TypeScript,
         Turborepo,
         Vercel,
         Supabase,
         Postgres,
         "Next.js",
         pnpm,
         tsup,
         dotenv,
         Drizzle,
         Capacitor,
         Tiptap,
         Taxila,
         Zinsser,
         Parrot,
         SaaS,
         iOS,
      ]

writings:
   root: ./sources/writings
   exclude: ["_archive/**"]

